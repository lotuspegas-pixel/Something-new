<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f0eee8" />
    <title>Babyunit — Luna Unit</title>
    <link rel="stylesheet" href="css/luna.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="panel baby-panel">
      <div class="topbar">
        <div class="brand">
          <div class="round-icon on">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M8 3h8M9 3c0 3-2 4-2 7v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9c0-3-2-4-2-7" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
          <div><div class="title">Luna Unit</div><div class="subtitle">Babyunit</div></div>
        </div>
        <div class="topstatus">
          <div class="pill" id="roomLabel">Kamer —</div>
          <div class="pill">🔋 <span class="mini-batt"><span class="fill" id="battFill" style="width:100%"></span></span> <span id="battPct">—</span></div>
        </div>
      </div>

      <div class="screen" id="screen">
        <video id="preview" autoplay playsinline muted></video>
        <div class="badge live"><span class="rec-dot breathe"></span><span>LIVE</span></div>
        <div class="badge db" style="left:auto;right:14px"><span class="dot off" id="liveDot" style="width:7px;height:7px"></span></div>
        <div class="placeholder" id="overlay">
          <div class="spinner"></div>
          <div id="statusBig" style="color:#fff;font-weight:700">Camera starten…</div>
          <div id="statusSub" style="font-size:12.5px"></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px;padding:12px 18px">
        <div class="info-row" style="padding:0"><span>Status</span><span class="v" id="connText">Wachten op ouderunit…</span></div>
      </div>

      <div class="card" id="pairCard" style="margin-top:14px;text-align:center">
        <div class="label" style="text-align:left">Koppelen — laat de ouder scannen</div>
        <div class="qr-display" id="pairQR" style="margin:0 auto 12px"></div>
        <div style="font:800 30px 'Quicksand',sans-serif;letter-spacing:8px;color:var(--text)" id="pairCode">——————</div>
        <div class="hint">Scan de QR-code met de ouderunit, of vul deze code in.</div>
      </div>

      <div class="baby-controls">
        <button class="bctrl" id="btnFlip" type="button"><span class="ic">🔄</span> Camera</button>
        <button class="bctrl active" id="btnMic" type="button"><span class="ic">🎙️</span> Microfoon</button>
        <button class="bctrl" id="btnTorch" type="button" disabled><span class="ic">🔦</span> Lamp</button>
        <button class="bctrl danger" id="btnStop" type="button"><span class="ic">⏹️</span> Stoppen</button>
      </div>

      <div class="grille" id="grille"></div>
    </div>

    <div class="nightlight-full hidden" id="nightlight"><div>💡 Nachtlamp aan (ingeschakeld door ouder)</div></div>
    <div class="toast hidden" id="toast"></div>

    <script src="js/common.js"></script>
    <script src="js/lullaby.js"></script>
    <script src="js/rtc.js"></script>
    <script src="js/baby.js"></script>
  </body>
</html>
