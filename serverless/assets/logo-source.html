<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Quicksand';
    src: url('quicksand.woff2') format('woff2');
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { width: max-content; height: 540px; display: flex; align-items: center; gap: 40px; }
  .mark { flex: 0 0 auto; }
  .word {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 140px;
    letter-spacing: -2px;
    line-height: 1;
    white-space: nowrap;
  }
  .pink { color: #FF8DB2; }
  .blue { color: #2F8FF0; }
  .i-wrap { position: relative; }
  .dot { position: absolute; left: 50%; transform: translateX(-50%); top: -4px; width: 30px; height: 27px; }
</style>
</head>
<body>
<div id="stage">
  <svg class="mark" width="430" height="520" viewBox="0 0 430 520" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- ============ ingebakerd lichaam ============ -->
    <path d="M222 214c94 0 168 70 168 154 0 76-74 132-168 132S54 444 54 368c0-84 74-154 168-154z"
          fill="#5AAEF5" stroke="#134A87" stroke-width="14" stroke-linejoin="round"/>
    <!-- lichte baan in de doek -->
    <path d="M62 424c26-92 112-166 226-196 20 14 38 33 50 55-108 26-190 96-232 186-20-13-34-27-44-45z"
          fill="#A6D6FA"/>
    <!-- vouwlijn van de doek -->
    <path d="M288 228C174 258 88 332 62 424" stroke="#134A87" stroke-width="14" stroke-linecap="round"/>

    <!-- ============ hoofd ============ -->
    <ellipse cx="62" cy="196" rx="25" ry="30" fill="#FBFCFE" stroke="#134A87" stroke-width="14"/>
    <circle cx="180" cy="180" r="120" fill="#FBFCFE" stroke="#134A87" stroke-width="14"/>
    <!-- krulletje -->
    <path d="M166 62c-4-23 10-38 29-38 18 0 30 15 28 32-2 14-12 23-24 26"
          stroke="#134A87" stroke-width="14" stroke-linecap="round" fill="#FBFCFE"/>

    <!-- gesloten oogjes -->
    <path d="M124 168c10-15 30-15 40 0" stroke="#134A87" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M206 168c10-15 30-15 40 0" stroke="#134A87" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- wangen -->
    <ellipse cx="114" cy="212" rx="21" ry="13" fill="#FBD3DC"/>
    <ellipse cx="256" cy="208" rx="21" ry="13" fill="#FBD3DC"/>
    <!-- glimlach -->
    <path d="M160 218c13 15 34 15 46 0" stroke="#134A87" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- blauwe slaap-accenten -->
    <path d="M92 148c9 8 9 19 0 26" stroke="#6EC1F5" stroke-width="11" stroke-linecap="round"/>
    <path d="M272 142c9 8 9 19 0 26" stroke="#6EC1F5" stroke-width="11" stroke-linecap="round"/>
    <path d="M190 196c8 6 8 15 0 21" stroke="#6EC1F5" stroke-width="10" stroke-linecap="round"/>

    <!-- ============ hartje rechtsonder ============ -->
    <path d="M318 372c-17-20-48-14-48 15 0 26 31 43 48 58 17-15 48-32 48-58 0-29-31-35-48-15z"
          fill="#FF8DB2" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  </svg>

  <div class="word"><span class="pink">Babyphone</span><span class="blue">.Onl<span class="i-wrap">i<svg class="dot" viewBox="0 0 24 22"><path d="M12 21C6 16.5 1 12.8 1 8.2 1 4.6 3.9 2 7.2 2c2 0 3.8 1 4.8 2.5C13 3 14.8 2 16.8 2 20.1 2 23 4.6 23 8.2c0 4.6-5 8.3-11 12.8z" fill="#2F8FF0"/></svg></span>ne</span>
  </div>
</div>
</body>
</html>
