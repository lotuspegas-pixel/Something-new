    var BLOG = {"en": {"title": "Turn two phones into a pet monitor — the full PetCam.online guide", "desc": "How PetCam.online turns a spare phone, an old tablet, or the two phones in your pocket into a private pet monitor — great at home and on the go. Every feature explained.", "kicker": "GUIDE", "h1": "Two phones, one pet monitor: everything PetCam.online can do", "lede": "No box to buy, no app to install, no account. Open the site on two devices you already own and you have a private pet monitor with live video and sound — at home or away.", "introP": "A traditional pet camera is one more gadget to buy, charge and pack. PetCam.online takes a different route: it turns devices you already have into the camera and the monitor, right in the browser. Here is why that is so handy — and what every button does.", "reuseH": "Give an old phone or tablet a second life", "reuseP": "That drawer phone from two upgrades ago, or a tablet nobody uses anymore — either one becomes the pet camera. Prop it up by the crate or the basket, open petcam.online, tap “Pet cam”, and it streams live video and sound to your own phone. No SIM card needed: home wifi is enough. A real pet camera, without buying — or throwing away — anything.", "travelH": "Made for days away and nights out", "travelP": "This is where it shines. When you're away from home you do not want to pack a bulky monitor with its own short-range signal. With PetCam.online you simply use the two phones you already carry: leave one with your pet at home, take the other with you to work or out for the evening. Because the connection runs over the internet (wifi or 4G/5G), the range is not limited to one building and you are not tied to a base-station signal. Two phones, and you are set — anywhere.", "setupH": "Connected in under a minute", "setupP": "Pairing is deliberately simple, so it takes seconds before you're out the door.", "steps": ["On the device that stays with your pet, tap “Pet cam”. It shows a 6-character code an .online, tik op “Pet-cam”, en hij stuurt live beeld en geluid naar je eigen telefoon. Geen simkaart nodig: je wifi thuis is genoeg. Een echte huisdiercamera, zonder iets te kopen — of weg te gooien.", "travelH": "Gemaakt voor dagjes weg en logeren", "travelP": "Hier blinkt het uit. Onderweg wil je geen logge camera met eigen kortbereik-signaal meesjouwen. Met PetCam.online gebruik je gewoon de twee telefoons die je al bij je hebt: laat er één bij je huisdier thuis, neem de andere mee naar je werk of een avondje uit. Omdat de verbinding via internet loopt (wifi of 4G/5G), zit je niet vast aan één gebouw of aan het signaal van een basisstation. Twee telefoons, en je bent klaar — waar dan ook.", "setupH": "Binnen een minuut verbonden", "setupP": "Koppelen is bewust simpel, zodat je binnen een paar tellen de deur uit kan.", "steps": ["Tik op het toestel dat bij je huisdier blijft op “Pet-cam”. Er verschijnt een code van 6 tekens en een QR-code.", "Tik op je eigen telefoon op “Eigenaarunit”.", "Typ de code of scan de QR — je ziet en hoort je huisdier meteen."], "featH": "Alle functies, en waar ze voor dienen", "featLede": "Alles bedien je vanaf de telefoon van de eigenaar, terwijl de pet-cam gewoon uitzendt. Hier is de volledige lijst.", "features": [{"n": "Live beeld & geluid", "d": "Zie en hoor je huisdier in realtime, met weinig vertraging — ook via 4G/5G, niet alleen thuis-wifi."}, {"n": "Terugpraten", "d": "Tik en praat: je stem klinkt bij je huisdier, zodat je kunt geruststellen zonder de kamer in te lopen."}, {"n": "Kalmerende geluiden & muziek", "d": "Speel rustgevende geluiden of je eigen mp3’s af op de pet-cam, direct vanaf je telefoon."}, {"n": "Nachtlampje", "d": "Zet vanaf jouw kant een zachte, warme gloed aan op het scherm van de pet-cam."}, {"n": "Geluidsalarm", "d": "Krijg een melding bij blaffen, janken of ander geluid, met een gevoeligheid die je zelf instelt, plus een activiteitenlog."}, {"n": "Rusttimer", "d": "Laat een kalmerend geluid spelen en vanzelf stoppen na de tijd die jij kiest."}, {"n": "Alleen geluid & privacyscherm", "d": "Houd het geluid maar verberg het beeld wanneer je beeld uit wilt maar oren aan."}, {"n": "Batterijstatus", "d": "Zie het accupercentage van de pet-cam op je scherm, zodat hij nooit ongemerkt leegloopt."}, {"n": "Fragment opnemen", "d": "Bewaar een stukje beeld en geluid direct op je eigen toestel. Er wordt niets geüpload."}, {"n": "Altijd herverbinden", "d": "Overleeft wisselen tussen wifi/mobiel en scherm-uit, en waarschuwt je zodra de verbinding wegvalt."}, {"n": "Meertalig", "d": "Engels en Nederlands zijn nu volledig vertaald, met meer talen onderweg."}, {"n": "Gratis, geen account", "d": "De kern-app is gratis en zonder aanmelden. Open de site en ga."}], "privacyH": "Privé van ontwerp", "privacyP": "Beeld en geluid gaan rechtstreeks tussen je twee toestellen, peer-to-peer en versleuteld onderweg. Er wordt niets opgenomen en geen enkele server kan meekijken. Geen account, geen advertenties, geen tracking — gewoon je eigen toestellen die met elkaar praten.", "worksH": "Werkt op de toestellen die je al hebt", "worksP": "Elke telefoon, tablet of laptop met een recente browser (Chrome, Safari, Firefox, Edge) werkt — ook oudere modellen, zolang de browser redelijk up-to-date is. Eén toestel heeft een camera en microfoon nodig voor de kant van je huisdier; houd het aan de lader en je komt de hele dag of nacht door.", "ctaH": "Probeer het vandaag", "ctaP": "Pak twee toestellen, open de site op allebei, en zie hoe snel het gaat.", "ctaBtn": "Open PetCam.online", "shotHome": "Open de site op elk toestel — geen installatie, geen account.", "shotParent": "De eigenaarunit: live beeld met terugpraten, kalmerende geluiden, nachtlampje, geluidsalarm en opnemen — allemaal vanaf je telefoon.", "shotBaby": "De pet-cam: live camera bij een knus plekje om over te waken, met camera-, microfoon-, alleen-geluid- en privacyscherm-knoppen.", "backToApp": "← Terug naar de app", "readTime": "4 min lezen", "updated": "Bijgewerkt juli 2026"}};
    var STORE_KEY = 'petcam.lang';
    var current = 'en';

    function detect() {
      try { var q = new URLSearchParams(location.search).get('lang'); if (q && LANGS.some(function(l){return l.code===q;})) return q; } catch (e) {}
      var saved = null; try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
      if (saved && LANGS.some(function(l){return l.code===saved;})) return saved;
      var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
      return LANGS.some(function(l){return l.code===nav;}) ? nav : 'en';
    }
    function T(key) {

      // stappen
