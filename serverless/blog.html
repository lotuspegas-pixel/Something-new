:"Zwei Handys, ein Babyphone: alles, was BabyPhone.online kann","lede":"Kein Gerät kaufen, keine App installieren, kein Konto. Öffne die Seite auf zwei Geräten, die du schon hast, und du hast ein privates Babyphone mit Live-Bild und -Ton — zu Hause oder im Urlaub.","introP":"Ein klassisches Babyphone ist ein weiteres Gerät zum Kaufen, Laden und Einpacken. BabyPhone.online geht einen anderen Weg: Es macht Geräte, die du bereits hast, zur Kamera und zum Monitor — direkt im Browser. Hier steht, warum das so praktisch ist und was jede Taste tut.","reuseH":"Gib einem alten Handy oder Tablet ein zweites Leben","reuseP":"Das Schubladen-Handy von vor zwei Modellen oder ein Tablet, das die Kinder kaum nutzen — beides wird zur Babykamera. Stell es ans Bettchen, öffne babyphone.online, tippe auf „Baby unit“, und es überträgt Live-Bild und -Ton auf dein eigenes Handy. Keine SIM-Karte nötig: WLAN zu Hause genügt. Eine echte Babykamera, ohne etwas zu kaufen — oder wegzuwerfen.","travelH":"Gemacht für Urlaub und Nächte auswärts","travelP":"Hier spielt es seine Stärke aus. Im Urlaub willst du kein sperriges Babyphone mit eigener kurzer Reichweite einpacken. Mit BabyPhone.online nutzt du einfach die zwei Handys, die du ohnehin dabeihast: Lass eines beim Baby im Hotelzimmer oder Zelt, nimm das andere mit auf die Terrasse oder ins Nebenzimmer. Weil die Verbindung übers Internet läuft (WLAN oder 4G/5G), ist die Reichweite nicht auf ein Gebäude beschränkt und du hängst nicht am Signal einer Basisstation. Zwei Handys, und du bist startklar — überall.","setupH":"In unter einer Minute verbunden","setupP":"Das Koppeln ist bewusst einfach, damit es auch halb verschlafen um 3 Uhr nachts klappt.","steps":["Tippe auf dem Gerät des Babys auf „Baby unit“. Es zeigt einen 6-stelligen Code und einen QR-Code.","Tippe auf deinem eigenen Handy auf „Parent unit“.","Gib den Code ein oder scanne den QR-Code — du siehst und hörst dein Baby sofort."],"featH":"Jede Funktion und wofür sie da ist","featLede":"Alles steuerst du vom Eltern-Handy, während das Baby-Gerät einfach überträgt. Hier ist die vollständige Liste.","features":[{"n":"Live-Bild & -Ton","d":"Sieh und höre dein Baby in Echtzeit mit geringer Verzögerung — auch über 4G/5G, nicht nur WLAN."},{"n":"Zurücksprechen","d":"Tippen und sprechen: Deine Stimme kommt beim Baby an, du kannst beruhigen, ohne hineinzugehen."},{"n":"Schlaflieder & Musik","d":"Spiele beruhigende Klänge oder eigene MP3s auf dem Baby-Gerät ab, direkt vom Handy."},{"n":"Nachtlicht","d":"Schalte von deiner Seite ein sanftes, warmes Leuchten auf dem Bildschirm des Baby-Geräts ein."},{"n":"Schrei-Alarm","d":"Werde benachrichtigt, wenn dein Baby weint — mit selbst eingestellter Empfindlichkeit und Protokoll."},{"n":"Einschlaf-Timer","d":"Lass ein Schlaflied spielen und nach der gewählten Zeit von selbst enden."},{"n":"Nur Ton & Sichtschutz","d":"Behalte den Ton, aber blende das Bild aus, wenn du Video aus, Ohren an willst."},{"n":"Akkustand","d":"Sieh den Akkustand des Baby-Geräts auf deinem Bildschirm, damit er nie unbemerkt leer wird."},{"n":"Clip aufnehmen","d":"Speichere einen Moment aus Bild und Ton direkt auf deinem Gerät. Nichts wird hochgeladen."},{"n":"Verbindet immer neu","d":"Übersteht WLAN-/Mobilfunk-Wechsel und Bildschirm aus und warnt dich, sobald die Verbindung abbricht."},{"n":"30 Sprachen","d":"Die ganze Oberfläche in deiner Sprache — einmal wählen, es wird gemerkt."},{"n":"Kostenlos, kein Konto","d":"Das Kern-Babyphone ist kostenlos und ohne Anmeldung. Seite öffnen und los."}],"privacyH":"Privat by Design","privacyP":"Bild und Ton laufen direkt zwischen deinen zwei Geräten, Peer-to-Peer und unterwegs verschlüsselt. Nichts wird aufgezeichnet, und kein Server kann mitschauen. Kein Konto, keine Werbung, kein Tracking — nur deine eigenen Geräte im Gespräch.","worksH":"Läuft auf den Geräten, die du schon hast","worksP":"Jedes Handy, Tablet oder jeder Laptop mit einem aktuellen Browser (Chrome, Safari, Firefox, Edge) funktioniert — auch ältere Modelle, solange der Browser einigermaßen aktuell ist. Ein Gerät braucht Kamera und Mikrofon für die Baby-Seite; lass es am Ladegerät und du kommst durch die ganze Nacht.","ctaH":"Probiere es heute Abend","ctaP":"Nimm zwei Geräte, öffne die Seite auf beiden und sieh, wie schnell es geht.","ctaBtn":"BabyPhone.online öffnen","shotHome":"Öffne die Seite auf jedem Gerät — keine Installation, kein Konto.","shotParent":"Die Elterneinheit: Live-Ansicht mit Zurücksprechen, Schlafliedern, Nachtlicht, Schrei-Alarm und Aufnahme — alles vom Handy.","shotBaby":"Die Babyeinheit: Live-Kamera, Raumcode und QR zum Koppeln, mit Kamera-, Mikrofon-, Nur-Ton- und Sichtschutz-Reglern.","backToApp":"← Zurück zur App","readTime":"4 Min. Lesezeit","updated":"Aktualisiert Juli 2026"},"fr":{"title":"Deux téléphones en babyphone — le guide complet BabyPhone.online","desc":"Comment BabyPhone.online transforme un téléphone de rechange, une vieille tablette ou les deux téléphones de votre poche en babyphone privé — à la maison et en vacances. Toutes les fonctions expliquées.","kicker":"GUIDE","h1":"Deux téléphones, un babyphone : tout ce que BabyPhone.online sait faire","lede":"Aucun appareil à acheter, aucune appli à installer, aucun compte. Ouvrez le site sur deux appareils que vous avez déjà et vous obtenez un babyphone privé avec image et son en direct — à la maison ou en vacances.","introP":"Un babyphone classique, c’est un appareil de plus à acheter, recharger et emporter. BabyPhone.online prend un autre chemin : il transforme des appareils que vous avez déjà en caméra et en moniteur, directement dans le navigateur. Voici pourquoi c’est si pratique — et à quoi sert chaque bouton.","reuseH":"Offrez une seconde vie à un vieux téléphone ou une tablette","reuseP":"Ce téléphone rangé dans un tiroir, ou une tablette que les enfants n’utilisent presque plus — l’un ou l’autre devient la caméra bébé. Posez-le près du lit, ouvrez babyphone.online, appuyez sur « Baby unit », et il diffuse image et son en direct vers votre propre téléphone. Pas besoin de carte SIM : le wifi de la maison suffit. Une vraie caméra bébé, sans rien acheter — ni jeter.","travelH":"Pensé pour les vacances et les nuits ailleurs","travelP":"C’est là qu’il brille. En vacances, vous ne voulez pas emporter un babyphone encombrant à courte portée. Avec BabyPhone.online, vous utilisez simplement les deux téléphones que vous avez déjà : laissez-en un près du bébé dans la chambre d’hôtel ou la tente, prenez l’autre sur la terrasse ou dans la pièce d’à côté. Comme la connexion passe par internet (wifi ou 4G/5G), la portée ne se limite pas à un bâtiment et vous ne dépendez pas du signal d’une base. Deux téléphones, et c’est prêt — partout.","setupH":"Connecté en moins d’une minute","setupP":"L’appairage est volontairement simple, pour le faire à moitié endormi à 3 h du matin.","steps":["Sur l’appareil du bébé, appuyez sur « Baby unit ». Il affiche un code de 6 caractères et un QR code.","Sur votre propre téléphone, appuyez sur « Parent unit ».","Tapez le code ou scannez le QR — vous voyez et entendez votre bébé aussitôt."],"featH":"Chaque fonction, et à quoi elle sert","featLede":"Tout se pilote depuis le téléphone parent, pendant que l’appareil bébé se contente de diffuser. Voici la liste complète.","features":[{"n":"Image & son en direct","d":"Voyez et entendez votre bébé en temps réel, avec peu de délai — aussi en 4G/5G, pas seulement en wifi."},{"n":"Parler en retour","d":"Appuyez et parlez : votre voix sort sur l’appareil bébé, pour rassurer sans entrer dans la pièce."},{"n":"Berceuses & musique","d":"Diffusez des sons apaisants ou vos propres MP3 sur l’appareil bébé, directement depuis votre téléphone."},{"n":"Veilleuse","d":"Allumez depuis votre côté une lueur douce et chaude sur l’écran de l’appareil bébé."},{"n":"Alerte pleurs","d":"Soyez alerté quand votre bébé pleure, avec une sensibilité que vous réglez, plus un journal d’événements."},{"n":"Minuteur de sommeil","d":"Laissez une berceuse jouer, puis s’arrêter d’elle-même après le temps choisi."},{"n":"Son seul & voile de confidentialité","d":"Gardez le son mais masquez l’image quand vous voulez la vidéo coupée, les oreilles ouvertes."},{"n":"Niveau de batterie","d":"Voyez la batterie de l’appareil bébé sur votre écran, pour qu’il ne s’éteigne jamais sans prévenir."},{"n":"Enregistrer un clip","d":"Sauvegardez un moment d’image et de son directement sur votre appareil. Rien n’est envoyé en ligne."},{"n":"Se reconnecte toujours","d":"Résiste aux passages wifi/mobile et à l’écran éteint, et vous alerte dès qu’une liaison tombe."},{"n":"30 langues","d":"Toute l’interface dans votre langue — choisie une fois, elle est mémorisée."},{"n":"Gratuit, sans compte","d":"Le babyphone de base est gratuit et sans inscription. Ouvrez le site et c’est parti."}],"privacyH":"Privé par conception","privacyP":"L’image et le son circulent directement entre vos deux appareils, en pair-à-pair et chiffrés pendant le transport. Rien n’est enregistré et aucun serveur ne peut regarder. Pas de compte, pas de pub, pas de pistage — juste vos appareils qui se parlent.","worksH":"Fonctionne sur les appareils que vous avez déjà","worksP":"Tout téléphone, tablette ou ordinateur avec un navigateur récent (Chrome, Safari, Firefox, Edge) convient — y compris des modèles plus anciens, tant que le navigateur est assez à jour. Un appareil a besoin d’une caméra et d’un micro côté bébé ; gardez-le sur son chargeur et vous tenez toute la nuit.","ctaH":"Essayez ce soir","ctaP":"Prenez deux appareils, ouvrez le site sur les deux, et voyez comme c’est rapide.","ctaBtn":"Ouvrir BabyPhone.online","shotHome":"Ouvrez le site sur n’importe quel appareil — sans installation, sans compte.","shotParent":"L’unité parent : vue en direct avec parler-en-retour, berceuses, veilleuse, alerte pleurs et enregistrement — le tout depuis votre téléphone.","shotBaby":"L’unité bébé : caméra en direct, code de chambre et QR pour l’appairage, avec réglages caméra, micro, son seul et voile de confidentialité.","backToApp":"← Retour à l’appli","readTime":"4 min de lecture","updated":"Mis à jour juillet 2026"},"es":{"title":"Dos móviles como vigilabebés — la guía completa de BabyPhone.online","desc":"Cómo BabyPhone.online convierte un móvil viejo, una tablet antigua o los dos móviles de tu bolsillo en un vigilabebés privado — en casa y de vacaciones. Todas las funciones explicadas.","kicker":"GUÍA","h1":"Dos móviles, un vigilabebés: todo lo que BabyPhone.online puede hacer","lede":"Sin aparato que comprar, sin app que instalar, sin cuenta. Abre el sitio en dos dispositivos que ya tienes y tendrás un vigilabebés privado con vídeo y sonido en directo — en casa o de vacaciones.","introP":"Un vigilabebés tradicional es un aparato más que comprar, cargar y llevar. BabyPhone.online toma otro camino: convierte dispositivos que ya tienes en la cámara y el monitor, directamente en el navegador. Aquí verás por qué es tan práctico — y qué hace cada botón.","reuseH":"Da una segunda vida a un móvil o tablet viejo","reuseP":"Ese móvil guardado en un cajón desde hace dos modelos, o una tablet que los niños apenas usan — cualquiera se convierte en la cámara del bebé. Colócalo junto a la cuna, abre babyphone.online, toca «Baby unit» y transmite vídeo y sonido en directo a tu propio móvil. Sin tarjeta SIM: basta el wifi de casa. Una cámara de bebé de verdad, sin comprar — ni tirar — nada.","travelH":"Hecho para las vacaciones y las noches fuera","travelP":"Aquí es donde brilla. De vacaciones no quieres cargar con un vigilabebés voluminoso de corto alcance. Con BabyPhone.online usas simplemente los dos móviles que ya llevas: deja uno con el bebé en la habitación del hotel o la tienda, y llévate el otro a la terraza o a la habitación de al lado. Como la conexión va por internet (wifi o 4G/5G), el alcance no se limita a un edificio y no dependes de la señal de una base. Dos móviles y listo — en cualquier sitio.","setupH":"Conectados en menos de un minuto","setupP":"El emparejamiento es a propósito sencillo, para hacerlo medio dormido a las 3 de la madrugada.","steps":["En el dispositivo del bebé, toca «Baby unit». Muestra un código de 6 caracteres y un código QR.","En tu propio móvil, toca «Parent unit».","Escribe el código o escanea el QR — ves y oyes a tu bebé al instante."],"featH":"Cada función, y para qué sirve","featLede":"Todo se maneja desde el móvil de los padres, mientras el dispositivo del bebé solo transmite. Aquí tienes la lista completa.","features":[{"n":"Vídeo y sonido en directo","d":"Ve y escucha a tu bebé en tiempo real, con poco retardo — también en 4G/5G, no solo en wifi."},{"n":"Hablar de vuelta","d":"Toca y habla: tu voz suena en el dispositivo del bebé, para calmarlo sin entrar en la habitación."},{"n":"Nanas y música","d":"Reproduce sonidos relajantes o tus propios MP3 en el dispositivo del bebé, directo desde tu móvil."},{"n":"Luz nocturna","d":"Enciende desde tu lado un brillo suave y cálido en la pantalla del dispositivo del bebé."},{"n":"Alerta de llanto","d":"Recibe un aviso cuando tu bebé llore, con una sensibilidad que fijas tú, más un registro de eventos."},{"n":"Temporizador de sueño","d":"Deja sonar una nana y que se detenga sola tras el tiempo que elijas."},{"n":"Solo audio y cortina de privacidad","d":"Mantén el sonido pero oculta la imagen cuando quieras vídeo apagado y oídos atentos."},{"n":"Estado de batería","d":"Ve la batería del dispositivo del bebé en tu pantalla, para que nunca se apague sin avisar."},{"n":"Grabar un clip","d":"Guarda un momento de vídeo y sonido directamente en tu dispositivo. No se sube nada."},{"n":"Siempre reconecta","d":"Sobrevive a los cambios wifi/móvil y a la pantalla apagada, y te avisa en cuanto se cae el enlace."},{"n":"30 idiomas","d":"Toda la interfaz en tu idioma — elígelo una vez y se recuerda."},{"n":"Gratis, sin cuenta","d":"El vigilabebés básico es gratis y sin registro. Abre el sitio y ya está."}],"privacyH":"Privado por diseño","privacyP":"El vídeo y el sonido viajan directamente entre tus dos dispositivos, de igual a igual y cifrados en tránsito. No se graba nada y ningún servidor puede mirar. Sin cuenta, sin anuncios, sin rastreo — solo tus dispositivos hablando entre ellos.","worksH":"Funciona en los dispositivos que ya tienes","worksP":"Cualquier móvil, tablet u ordenador con un navegador reciente (Chrome, Safari, Firefox, Edge) sirve — incluidos modelos más antiguos, mientras el navegador esté razonablemente al día. Un dispositivo necesita cámara y micrófono para el lado del bebé; déjalo en el cargador y aguantas toda la noche.","ctaH":"Pruébalo esta noche","ctaP":"Coge dos dispositivos, abre el sitio en ambos y comprueba lo rápido que es.","ctaBtn":"Abrir BabyPhone.online","shotHome":"Abre el sitio en cualquier dispositivo — sin instalación, sin cuenta.","shotParent":"La unidad de los padres: vista en directo con hablar de vuelta, nanas, luz nocturna, alerta de llanto y grabación — todo desde tu móvil.","shotBaby":"La unidad del bebé: cámara en directo, código de sala y QR para emparejar, con controles de cámara, micro, solo audio y cortina de privacidad.","backToApp":"← Volver a la app","readTime":"4 min de lectura","updated":"Actualizado julio de 2026"},"pt":{"title":"Dois telemóveis como babá eletrónica — o guia completo do BabyPhone.online","desc":"Como o BabyPhone.online transforma um telemóvel antigo, um tablet velho ou os dois telemóveis do seu bolso numa babá eletrónica privada — em casa e nas férias. Todas as funções explicadas.","kicker":"GUIA","h1":"Dois telemóveis, uma babá eletrónica: tudo o que o BabyPhone.online faz","lede":"Sem aparelho para comprar, sem app para instalar, sem conta. Abra o site em dois dispositivos que já tem e fica com uma babá eletrónica privada com vídeo e som ao vivo — em casa ou nas férias.","introP":"Uma babá eletrónica tradicional é mais um aparelho para comprar, carregar e transportar. O BabyPhone.online segue outro caminho: transfo     var STORE_KEY = 'babyfoon.lang';
    var current = 'en';

    function detect() {
      try { var q = new URLSearchParams(location.search).get('lang'); if (q && LANGS.some(function(l){return l.code===q;})) return q; } catch (e) {}
      var saved = null; try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
      if (saved && LANGS.some(function(l){return l.code===saved;})) return saved;
      var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
      return LANGS.some(function(l){return l.code===nav;}) ? nav : 'en';
    }
    function T(key) {
      var c = BLOG[current] || {};
      return (c[key] != null) ? c[key] : BLOG.en[key];
    }
    function render() {
      var c = BLOG[current] || {};
      var meta = LANGS.filter(function(l){return l.code===current;})[0] || {};
      var translated = !!BLOG[current];
      document.documentElement.setAttribute('lang', current);
      document.documentElement.setAttribute('dir', (translated && meta.rtl) ? 'rtl' : 'ltr');
      document.title = T('title');
      var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute('content', T('desc'));

      var nodes = document.querySelectorAll('[data-b]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = T(nodes[i].getAttribute('data-b'));

      // stappen
      var ol = document.getElementById('steps'); ol.textContent = '';
      (T('steps') || []).forEach(function (s) { var li = document.createElement('li'); li.textContent = s; ol.appendChild(li); });
      // functies
      var ul = document.getElementById('features'); ul.textContent = '';
      (T('features') || []).forEach(function (f) {
        var li = document.createElement('li');
        var b = document.createElement('b'); b.textContent = f.n;
        var sp = document.createElement('span'); sp.textContent = f.d;
        li.appendChild(b); li.appendChild(sp); ul.appendChild(li);
      });
      // app-links behouden de taal
      var q = current === 'en' ? './' : ('./?lang=' + current);
      ['brandLink', 'backLink', 'ctaLink'].forEach(function (id) { var el = document.getElementById(id); if (el) el.setAttribute('href', q); });
    }
    function setLang(code) {
      if (!LANGS.some(function(l){return l.code===code;})) code = 'en';
      current = code;
      try { localStorage.setItem(STORE_KEY, code); } catch (e) {}
      try {
        var u = new URL(location.href);
        if (code === 'en') u.searchParams.delete('lang'); else u.searchParams.set('lang', code);
        history.replaceState(null, '', u);
      } catch (e) {}
      render();
    }
    // taalkiezer
    var sel = document.createElement('select');
    sel.className = 'lang-select';
    sel.setAttribute('aria-label', 'Language');
    LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l.code; o.textContent = l.name; sel.appendChild(o); });
    document.getElementById('langSel').appendChild(sel);
    sel.addEventListener('change', function () { setLang(sel.value); });

    current = detect();
    sel.value = current;
    render();
  })();
