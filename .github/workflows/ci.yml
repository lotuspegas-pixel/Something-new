name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint (syntax check all JS)
        run: |
          node -c server.js
          for f in serverless/js/*.js public/js/*.js test/*.js; do
            [ -e "$f" ] && node -c "$f"
          done

      - name: E2E — server variant
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          npm test
          npm run test:reconnect
          kill $SERVER_PID

      - name: E2E — serverless variant (pairing, views, reconnect)
        run: npm run test:serverless

      - name: E2E — tijd tot eerste beeld (snelheidsregressie)
        run: npm run test:timing

      - name: E2E — oude browsers (API's van Safari 12 gesloopt)
        run: npm run test:oldbrowser

      - name: E2E — mediaverbinding valt weg terwijl datakanaal blijft
        run: npm run test:media

      - name: E2E — auditbevindingen (gedrag en weergave)
        run: npm run test:audit

      - name: E2E — scherm uit, achtergrond en onderbroken sporen
        run: npm run test:background

      - name: E2E — stabiliteit (koppelserver weg, trage herverbinding, wake-storm)
        run: npm run test:stability

      - name: Vertalingen compleet in alle 30 talen
        run: npm run test:i18n
