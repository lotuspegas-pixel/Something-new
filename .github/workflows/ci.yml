name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint (syntax check all JS)
        run: |
          node -c server.js
          for f in serverless/js/*.js test/*.js; do
            [ -e "$f" ] && node -c "$f"
          done
          node --check functions/entitlement-worker.mjs

      - name: E2E — serverless app (pairing, views, reconnect)
        run: npm run test:serverless
