name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint (syntax check all JS)
        run: |
          node -c server.js
          for f in serverless/js/*.js public/js/*.js test/*.js; do
            [ -e "$f" ] && node -c "$f"
          done

      - name: E2E — server variant
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          npm test
          npm run test:reconnect
          kill $SERVER_PID

      - name: E2E — serverless variant (pairing, views, reconnect)
        run: npm run test:serverless

      - name: E2E — tijd tot eerste beeld (snelheidsregressie)
        run: npm run test:timing

      - name: E2E — oude browsers (API's van Safari 12 gesloopt)
        run: npm run test:oldbrowser

      - name: E2E — mediaverbinding valt weg terwijl datakanaal blijft
        run: npm run test:media

      - name: E2E — auditbevindingen (gedrag en weergave)
        run: npm run test:audit

      - name: E2E — scherm uit, achtergrond en onderbroken sporen
        run: npm run test:background

      - name: E2E — stabiliteit (koppelserver weg, trage herverbinding, wake-storm)
        run: npm run test:stability

      - name: E2E — donatieknop (Stripe-link, 30 talen, geen overloop)
        run: npm run test:donate

      - name: E2E — veiligheidsartikel (alle 30 talen leesbaar)
        run: npm run test:securitypage

      - name: E2E — gidsartikel (alle 30 talen leesbaar)
        run: npm run test:blogpage

      - name: E2E — WebKit/iOS-gedrag (Safari op iPhone en iPad)
        run: npm run test:webkit

      - name: E2E — Android-gedrag (Chrome, Samsung Internet, WebView)
        run: npm run test:android

      # Agent-gereedheid: koppen, robots.txt, llms.txt, Markdown op verzoek en
      # WebMCP. Apache is nodig om de .htaccess-regels echt te zien werken; de
      # stap faalt als hij ontbreekt, in plaats van die controle over te slaan.
      - name: E2E — agent-gereedheid (llms.txt, Markdown, WebMCP, .htaccess op echte Apache)
        run: |
          sudo apt-get install -y --no-install-recommends apache2
          sudo systemctl stop apache2 || true
          VERPLICHT_APACHE=1 npm run test:agent

      - name: Vertalingen compleet in alle 30 talen
        run: npm run test:i18n

      # Demo-omstandigheden: koppelserver weg/traag, TURN onbereikbaar, verse
      # toestemmingen, trage 4G, onbeveiligde oorsprong. De twaalf bevindingen
      # die hier ooit als "bekend" stonden (B1 t/m B12) zijn opgelost en hun
      # kenmerken zijn verwijderd: elke rode controle is nu een regressie en
      # breekt de bouw.
      - name: E2E — demo-omstandigheden (koppelserver, TURN, toestemmingen, 4G)
        run: npm run test:demo
